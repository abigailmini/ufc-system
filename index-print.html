<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>UFC · Trader Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css"/>

  <style id="print-styles">
    @page { size: A4; margin: 12mm; }
    @media print {
      html, body {
        background: #ffffff !important;
        color: #0a0a0a;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .sidebar, .topbar, .tweaks-panel, .toast-wrap,
      [class*="tweaks"], [data-print-hide] { display: none !important; }
      .app-shell, .main, .page, .content-wrap {
        margin: 0 !important; padding: 0 !important; width: 100% !important; max-width: 100% !important;
      }
      .card, section, article {
        break-inside: avoid; page-break-inside: avoid;
        background: #0e1018 !important;
        color: #e7e9ee !important;
      }
      a { text-decoration: none; color: inherit; }
      * { animation: none !important; transition: none !important; }
    }
    @media print {
      body * { box-shadow: none !important; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="data.jsx?v=5"></script>
  <script type="text/babel" src="ui.jsx?v=5"></script>
  <script type="text/babel" src="shell.jsx?v=5"></script>
  <script type="text/babel" src="dashboard.jsx?v=5"></script>
  <script type="text/babel" src="page-genetic.jsx"></script>
  <script type="text/babel" src="page-submit.jsx"></script>
  <script type="text/babel" src="page-withdrawals.jsx"></script>
  <script type="text/babel" src="page-pages.jsx"></script>
  <script type="text/babel" src="page-discord-profile.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script type="text/babel" id="auto-print">
    (async () => {
      // Wait for fonts
      if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(e){} }
      // Wait for React app to mount and for any images to settle
      const waitFor = (cond, ms=4000) => new Promise(res => {
        const t0 = Date.now();
        const tick = () => cond() || (Date.now()-t0 > ms) ? res() : requestAnimationFrame(tick);
        tick();
      });
      await waitFor(() => document.querySelector('.main, .page, [data-route]'));
      // Wait for all images to load
      const imgs = Array.from(document.images);
      await Promise.all(imgs.map(im => im.complete ? null : new Promise(r => { im.onload = im.onerror = r; })));
      // Extra safety delay
      await new Promise(r => setTimeout(r, 700));
      window.print();
    })();
  </script>
</body>
</html>
